schema_version: benchmark-job/v1
job_id: job-benchmark_timing_12hr-465-1
schedule:
  enabled: true
  kind: online
  driver: aiperf
  service_id: service-benchmark_timing_12hr-465-1
  operation: replace_service
  start_at_offset_minutes: 465
  stop_at_offset_minutes: 720
spec:
  user_id: tenant_chat_premium
  optimization_goal: latency
  precision: fp16
  features:
    isl_token_avg: 1200
    isl_token_min: 300
    isl_token_max: 4096
    isl_distribution_type: LogNormal
    osl_token_avg: 550
    osl_token_min: 137
    osl_token_max: 1600
    osl_distribution_type: LogNormal
    request_arrival_pattern: Bursty
    peak_to_mean_ratio: 3
    workload_prefix_concentration: 0.5
    multi_turn_ratio: 0.7
    shared_prefix_length_avg: 300
    is_session_affinity: true
    priority_class: HIGH
    max_concurrent_streaming: 24
    target_p99_ttft_ms: 1000
    target_p99_tpot_ms: 45
workload:
  schemaVersion: '2.0'
  randomSeed: 101
  benchmark:
    model: Qwen/Qwen3-Next-80B-A3B-Thinking
    endpoint:
      path: /v1/chat/completions
      type: chat
      streaming: true
      timeout: 300
      connectionReuse: pooled
    tokenizer:
      name: ${TOKENIZER_NAME:Qwen/Qwen3-Next-80B-A3B-Thinking}
    dataset:
      type: synthetic
      entries: 1000
      sampling: random
      prompts: null
      turns: 1
    phases:
    - name: profiling
      type: gamma
      duration: 15300
      rate: 0.85
      smoothness: 0.23
      concurrency: 24
      gracePeriod: 1200
