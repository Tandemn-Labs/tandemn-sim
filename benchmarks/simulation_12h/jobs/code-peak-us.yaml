schema_version: benchmark-job/v1
job_id: job-benchmark_timing_12hr-180-1
schedule:
  enabled: true
  kind: online
  driver: aiperf
  service_id: service-benchmark_timing_12hr-180-1
  operation: additive_stream
  start_at_offset_minutes: 180
  stop_at_offset_minutes: 400
spec:
  user_id: tenant_code_autocomplete
  optimization_goal: latency
  precision: fp16
  features:
    isl_token_avg: 2200
    isl_token_min: 550
    isl_token_max: 6000
    isl_distribution_type: LogNormal
    osl_token_avg: 96
    osl_token_min: 24
    osl_token_max: 280
    osl_distribution_type: LogNormal
    request_arrival_pattern: Bursty
    peak_to_mean_ratio: 3.5
    workload_prefix_concentration: 0
    multi_turn_ratio: 0
    shared_prefix_length_avg: 1
    is_session_affinity: false
    priority_class: STANDARD
    max_concurrent_streaming: 96
    target_p99_ttft_ms: 160
    target_p99_tpot_ms: 45
workload:
  schemaVersion: '2.0'
  randomSeed: 101
  benchmark:
    model: Qwen/Qwen2.5-Coder-32B-Instruct
    endpoint:
      path: /v1/chat/completions
      type: chat
      streaming: true
      timeout: 120
      connectionReuse: pooled
    tokenizer:
      name: ${TOKENIZER_NAME:Qwen/Qwen2.5-Coder-32B-Instruct}
    dataset:
      type: synthetic
      entries: 2000
      sampling: random
      prompts: null
      turns: 1
    phases:
    - name: profiling
      type: gamma
      duration: 13200
      rate: 15.0
      smoothness: 0.403
      concurrency: 96
      gracePeriod: 1200
