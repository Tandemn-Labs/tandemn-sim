schema_version: benchmark-job/v1
job_id: job-benchmark_timing_24hr-540-2
schedule:
  enabled: true
  kind: online
  driver: aiperf
  service_id: service-benchmark_timing_24hr-540-2
  operation: base_service
  start_at_offset_minutes: 540
  stop_at_offset_minutes: 960
spec:
  user_id: tenant_docs_qa
  optimization_goal: latency
  precision: fp16
  features:
    isl_token_avg: 7000
    isl_token_min: 1750
    isl_token_max: 24000
    isl_distribution_type: LogNormal
    osl_token_avg: 300
    osl_token_min: 75
    osl_token_max: 1000
    osl_distribution_type: LogNormal
    request_arrival_pattern: Poisson
    peak_to_mean_ratio: 2
    workload_prefix_concentration: 0.5
    multi_turn_ratio: 0
    shared_prefix_length_avg: 1750
    is_session_affinity: false
    priority_class: STANDARD
    max_concurrent_streaming: 24
    target_p99_ttft_ms: 1300
    target_p99_tpot_ms: 55
workload:
  schemaVersion: '2.0'
  randomSeed: 102
  benchmark:
    model: microsoft/phi-4
    endpoint:
      path: /v1/chat/completions
      type: chat
      streaming: true
      timeout: 300
      connectionReuse: pooled
    tokenizer:
      name: ${TOKENIZER_NAME:microsoft/phi-4}
    dataset:
      type: synthetic
      entries: 2000
      sampling: random
      prompts: null
      turns: 1
    phases:
    - name: profiling
      type: poisson
      duration: 25200
      rate: 1.2
      concurrency: 24
      gracePeriod: 1200
