schema_version: benchmark-job/v1
job_id: job-benchmark_timing_12hr_homogenous-330-1
schedule:
  enabled: true
  kind: online
  driver: aiperf
  service_id: service-benchmark_timing_12hr_homogenous-330-1
  operation: additive_stream
  start_at_offset_minutes: 330
  stop_at_offset_minutes: 410
spec:
  user_id: tenant_qwen_long_context_chat
  optimization_goal: latency
  precision: bf16
  features:
    isl_token_avg: 24000
    isl_token_min: 6000
    isl_token_max: 96000
    isl_distribution_type: LogNormal
    osl_token_avg: 260
    osl_token_min: 65
    osl_token_max: 900
    osl_distribution_type: LogNormal
    request_arrival_pattern: Bursty
    peak_to_mean_ratio: 3.5
    workload_prefix_concentration: 0.5
    multi_turn_ratio: 0.3
    shared_prefix_length_avg: 4000
    is_session_affinity: true
    priority_class: STANDARD
    max_concurrent_streaming: 8
    target_p99_ttft_ms: 3000
    target_p99_tpot_ms: 65
workload:
  schemaVersion: '2.0'
  randomSeed: 101
  benchmark:
    model: Qwen/Qwen3-Next-80B-A3B-Thinking
    endpoint:
      path: /v1/chat/completions
      type: chat
      streaming: true
      timeout: 1200
      connectionReuse: pooled
    tokenizer:
      name: ${TOKENIZER_NAME:Qwen/Qwen3-Next-80B-A3B-Thinking}
    dataset:
      type: synthetic
      entries: 64
      sampling: random
      prompts: null
      turns: 1
    phases:
    - name: profiling
      type: gamma
      duration: 4800
      rate: 0.06
      smoothness: 0.125
      concurrency: 8
      gracePeriod: 1200
