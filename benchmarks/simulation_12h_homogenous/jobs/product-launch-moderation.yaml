schema_version: benchmark-job/v1
job_id: job-benchmark_timing_12hr_homogenous-420-2
schedule:
  enabled: true
  kind: online
  driver: aiperf
  service_id: service-benchmark_timing_12hr_homogenous-420-2
  operation: additive_stream
  start_at_offset_minutes: 420
  stop_at_offset_minutes: 490
spec:
  user_id: tenant_safety_moderation
  optimization_goal: latency
  precision: bf16
  features:
    isl_token_avg: 320
    isl_token_min: 80
    isl_token_max: 1024
    isl_distribution_type: LogNormal
    osl_token_avg: 8
    osl_token_min: 2
    osl_token_max: 32
    osl_distribution_type: LogNormal
    request_arrival_pattern: Bursty
    peak_to_mean_ratio: 3.5
    workload_prefix_concentration: 0
    multi_turn_ratio: 0
    shared_prefix_length_avg: 1
    is_session_affinity: false
    priority_class: HIGH
    max_concurrent_streaming: 32
    target_p99_ttft_ms: 90
    target_p99_tpot_ms: 30
workload:
  schemaVersion: '2.0'
  randomSeed: 102
  benchmark:
    model: meta-llama/Llama-3.2-1B-Instruct
    endpoint:
      path: /v1/chat/completions
      type: chat
      streaming: true
      timeout: 120
      connectionReuse: pooled
    tokenizer:
      name: ${TOKENIZER_NAME:meta-llama/Llama-3.2-1B-Instruct}
    dataset:
      type: synthetic
      entries: 5000
      sampling: random
      prompts: null
      turns: 1
    phases:
    - name: profiling
      type: gamma
      duration: 4200
      rate: 28.0
      smoothness: 0.001
      concurrency: 32
      gracePeriod: 1200
