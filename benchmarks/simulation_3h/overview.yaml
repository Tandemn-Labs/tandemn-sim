# Benchmark overview contract:
# - Resolve config paths relative to this file.
# - Dispatch enabled jobs on the first controller poll at or after their start.
# - For online jobs, stop new requests at the stop offset and drain in-flight work.
# - For batch jobs, stop on completion, mark deadline misses, and enforce T+210.
schema_version: "benchmark/v1"

benchmark:
  id: simulation_3h
  source_overview: ../../workload_overviews/simulation/benchmark_timing_3hr.md
  clock: time.time
  horizon_minutes: 180
  drain_minutes: 30
  poll_interval_seconds: 60
  shutdown_grace_seconds: 60
  reoptimization_tick_minutes: 5
  dispatch_at_exact_offset: false
  online_stop_action: stop_new_requests_and_drain_in_flight
  hard_stop_at_offset_minutes: 210

jobs:
  job-benchmark_timing_3hr-0-1:
    enabled: true
    kind: online
    tenant: tenant_chat_free
    driver: aiperf
    config: jobs/chat-free-core.yaml
    service_id: service-benchmark_timing_3hr-0-1
    operation: base_service
    start_at_offset_minutes: 0
    stop_at_offset_minutes: 180

