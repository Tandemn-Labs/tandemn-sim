# Benchmark overview contract:
# - Resolve config paths relative to this file.
# - Dispatch enabled jobs on the first controller poll at or after their start.
# - For online jobs, stop new requests at the stop offset and drain in-flight work.
# - For batch jobs, stop on completion, mark deadline misses, and enforce T+210.
schema_version: "benchmark/v1"

benchmark:
  id: simulation_3h
  source_benchmark: benchmark.md
  clock: time.time
  horizon_minutes: 180
  drain_minutes: 30
  poll_interval_seconds: 60
  shutdown_grace_seconds: 60
  reoptimization_tick_minutes: 5
  dispatch_at_exact_offset: false
  online_stop_action: stop_new_requests_and_drain_in_flight
  hard_stop_at_offset_minutes: 210

jobs:
  job-benchmark_timing_3hr-0-1:
    enabled: true
    kind: online
    submission:
      user_id: tenant_chat_free
      spec_json:
        model_id: meta-llama/Llama-3.2-1B-Instruct
        job_features:
          isl_token_avg: 900
          isl_token_min: 225
          isl_token_max: 2200
          isl_distribution_type: LogNormal
          osl_token_avg: 300
          osl_token_min: 75
          osl_token_max: 700
          osl_distribution_type: LogNormal
          request_arrival_pattern: Diurnal
          peak_to_mean_ratio: 2
          workload_prefix_concentration: 0.5
          multi_turn_ratio: 0.7
          shared_prefix_length_avg: 225
          is_session_affinity: true
          priority_class: LOW
          max_concurrent_streaming: 12000
          target_p99_ttft_ms: 700
          target_p99_tpot_ms: 55
    tenant: tenant_chat_free
    driver: aiperf
    config: jobs/chat-free-core.yaml
