# Benchmark job: job-benchmark_timing_3hr-100-2
# Benchmark window: T+100 through T+150. Declared pattern: Bursty.
# Priority: HIGH. SLO: p99 TTFT 350 ms; p99 TPOT 40 ms.
# Trace: datasets/simulation_3h/traces/safety_p0_live_analysis.json
# Measured: 0.883 mean RPS, 20.000 max RPS, 20.359 interarrival CV.
# Mapping: Gamma arrivals; smoothness = 1 / interarrival CV^2.
job:
  user_id: tenant_safety_reasoner
  optimization_goal: latency
  features:
    isl_token_avg: 900
    isl_token_min: 225
    isl_token_max: 3000
    isl_distribution_type: LogNormal
    osl_token_avg: 160
    osl_token_min: 40
    osl_token_max: 600
    osl_distribution_type: LogNormal
    request_arrival_pattern: Bursty
    peak_to_mean_ratio: 3
    workload_prefix_concentration: 0
    multi_turn_ratio: 0
    shared_prefix_length_avg: 1
    is_session_affinity: false
    priority_class: HIGH
    max_concurrent_streaming: 2500
    target_p99_ttft_ms: 350
    target_p99_tpot_ms: 40

schemaVersion: "2.0"
randomSeed: 102

benchmark:
  model: microsoft/phi-4
  endpoint:
    path: /v1/chat/completions
    type: chat
    streaming: true
    timeout: 180
    connectionReuse: pooled
  tokenizer:
    name: ${TOKENIZER_NAME:microsoft/phi-4}
  dataset:
    type: synthetic
    entries: 1500
    sampling: random
    prompts:
      isl: {mean: 455.722, median: 394, min: 256, max: 1949}
      osl: {mean: 134.296, median: 119, min: 64, max: 499}
    turns: 1
  phases:
    - name: profiling
      type: gamma
      duration: 3000
      rate: 0.883
      smoothness: 0.002
      concurrency: 2500
      gracePeriod: 180
