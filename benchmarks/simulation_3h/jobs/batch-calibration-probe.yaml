# job-benchmark_timing_3hr-85-1
job:
  user_id: tenant_koi_profiling
  optimization_goal: throughput
  features:
    isl_token_avg: 1400
    isl_token_min: 350
    isl_token_max: 4096
    isl_distribution_type: LogNormal
    osl_token_avg: 512
    osl_token_min: 128
    osl_token_max: 1600
    osl_distribution_type: LogNormal
    request_arrival_pattern: Constant
    peak_to_mean_ratio: 1
    workload_prefix_concentration: 0
    multi_turn_ratio: 0
    shared_prefix_length_avg: 1
    is_session_affinity: false
    total_token_budget: 22944000
    priority_class: LOW
    deadline_hrs: 1.4167
    target_p99_ttft_ms: 12000
    target_p99_tpot_ms: 200

schema_version: "batch-dataset/v1"

dataset:
  id: calibration_probe
  model: Qwen/Qwen2.5-14B-Instruct
  endpoint: /v1/chat/completions
  request_format: chat
  record_count: 12000
  seed: 204

  partitioning:
    shard_count: 24
    requests_per_shard: 500

  io:
    input_tokens:
      distribution: lognormal
      minimum: 350
      average: 1400
      maximum: 4096
      sigma: 0.8
    output_tokens:
      distribution: lognormal
      minimum: 128
      average: 512
      maximum: 1600
      sigma: 0.8
