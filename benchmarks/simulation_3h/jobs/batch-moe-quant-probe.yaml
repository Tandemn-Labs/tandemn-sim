# job-benchmark_timing_3hr-160-1
schema_version: "batch-dataset/v1"

dataset:
  id: moe_quant_probe
  model: Qwen/Qwen3-30B-A3B-Instruct
  endpoint: /v1/chat/completions
  request_format: chat
  record_count: 24000
  seed: 208

  partitioning:
    shard_count: 48
    requests_per_shard: 500

  io:
    input_tokens:
      distribution: lognormal
      minimum: 250
      average: 1000
      maximum: 4096
      sigma: 0.8
    output_tokens:
      distribution: lognormal
      minimum: 200
      average: 800
      maximum: 3000
      sigma: 0.8
