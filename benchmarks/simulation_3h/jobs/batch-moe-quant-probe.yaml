# job-benchmark_timing_3hr-160-1
job:
  user_id: tenant_koi_profiling
  optimization_goal: throughput
  features:
    isl_token_avg: 1000
    isl_token_min: 250
    isl_token_max: 4096
    isl_distribution_type: LogNormal
    osl_token_avg: 800
    osl_token_min: 200
    osl_token_max: 3000
    osl_distribution_type: LogNormal
    request_arrival_pattern: Constant
    peak_to_mean_ratio: 1
    workload_prefix_concentration: 0
    multi_turn_ratio: 0
    shared_prefix_length_avg: 1
    is_session_affinity: false
    total_token_budget: 43200000
    priority_class: LOW
    deadline_hrs: 0.3333
    target_p99_ttft_ms: 12000
    target_p99_tpot_ms: 200

schema_version: "batch-dataset/v1"

dataset:
  id: moe_quant_probe
  model: Qwen/Qwen3-30B-A3B-Instruct
  endpoint: /v1/chat/completions
  request_format: chat
  record_count: 24000
  seed: 208

  partitioning:
    shard_count: 48
    requests_per_shard: 500

  io:
    input_tokens:
      distribution: lognormal
      minimum: 250
      average: 1000
      maximum: 4096
      sigma: 0.8
    output_tokens:
      distribution: lognormal
      minimum: 200
      average: 800
      maximum: 3000
      sigma: 0.8
