# Benchmark job: job-benchmark_timing_3hr-7-1
# Benchmark window: T+7 through T+180. Declared pattern: Poisson.
# Priority: STANDARD. SLO: p99 TTFT 1500 ms; p99 TPOT 55 ms.
# Trace: datasets/simulation_3h/traces/search_rag_analysis.json
# Measured: 0.020 mean RPS, 2.000 max RPS, 1.064 interarrival CV.
# Mapping: Poisson arrivals at the measured mean request rate.
job:
  user_id: tenant_search_rag
  optimization_goal: latency
  precision: fp16
  features:
    isl_token_avg: 9000
    isl_token_min: 2250
    isl_token_max: 32000
    isl_distribution_type: LogNormal
    osl_token_avg: 220
    osl_token_min: 55
    osl_token_max: 700
    osl_distribution_type: LogNormal
    request_arrival_pattern: Poisson
    peak_to_mean_ratio: 2
    workload_prefix_concentration: 0.5
    multi_turn_ratio: 0.3
    shared_prefix_length_avg: 2250
    is_session_affinity: true
    priority_class: STANDARD
    max_concurrent_streaming: 2600
    target_p99_ttft_ms: 1500
    target_p99_tpot_ms: 55

schemaVersion: "2.0"
randomSeed: 101

benchmark:
  model: microsoft/phi-4
  endpoint:
    path: /v1/chat/completions
    type: chat
    streaming: true
    timeout: 300
    connectionReuse: pooled
  tokenizer:
    name: ${TOKENIZER_NAME:microsoft/phi-4}
  dataset:
    type: synthetic
    entries: 512
    sampling: random
    prompts:
    turns: 1
  phases:
    - name: profiling
      type: poisson
      duration: 10380
      rate: 0.020
      concurrency: 2600
      gracePeriod: 300
