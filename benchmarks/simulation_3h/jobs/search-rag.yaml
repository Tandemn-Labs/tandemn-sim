# Benchmark job: job-benchmark_timing_3hr-7-1
# Benchmark window: T+7 through T+180. Declared pattern: Poisson.
# Priority: STANDARD. SLO: p99 TTFT 1500 ms; p99 TPOT 55 ms.
# Trace: datasets/simulation_3h/traces/search_rag_analysis.json
# Measured: 0.020 mean RPS, 2.000 max RPS, 1.064 interarrival CV.
# Mapping: Poisson arrivals at the measured mean request rate.
schemaVersion: "2.0"
randomSeed: 101

benchmark:
  model: Qwen/Qwen2.5-14B-Instruct
  endpoint:
    path: /v1/chat/completions
    type: chat
    streaming: true
    timeout: 300
    connectionReuse: pooled
  tokenizer:
    name: ${TOKENIZER_NAME:Qwen/Qwen2.5-14B-Instruct}
  dataset:
    type: synthetic
    entries: 512
    sampling: random
    prompts:
      isl: {mean: 2969.874, stddev: 976.910, min: 1052, max: 5339}
      osl: {mean: 277.150, median: 238, min: 7, max: 931}
    turns: 1
  phases:
    - name: profiling
      type: poisson
      duration: 10380
      rate: 0.020
      concurrency: 2600
      gracePeriod: 300
