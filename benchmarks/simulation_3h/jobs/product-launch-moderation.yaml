# Benchmark job: job-benchmark_timing_3hr-49-2
# Benchmark window: T+49 through T+84. Bursty traffic with a 3.5x peak/mean ratio.
# Priority: HIGH. SLO: p99 TTFT 90 ms; p99 TPOT 30 ms.
# Traffic hypothesis: 51,948.052 mean RPS with clustered Gamma arrivals.
schemaVersion: "2.0"
randomSeed: 102

benchmark:
  model: Qwen/Qwen2.5-1.5B-Instruct
  endpoint:
    url: http://preview.invalid/v1/chat/completions
    type: chat
    streaming: true
    timeout: 120
    connectionReuse: pooled
  tokenizer:
    name: ${TOKENIZER_NAME:Qwen/Qwen2.5-1.5B-Instruct}
  dataset:
    type: synthetic
    entries: 5000
    sampling: random
    prompts:
      isl: {mean: 320, median: 240, min: 80, max: 1024}
      osl: {mean: 8, median: 6, min: 2, max: 32}
    turns: 1
  phases:
    - name: profiling
      type: gamma
      duration: 2100
      rate: 51948.052
      smoothness: 0.16
      concurrency: 60000
      gracePeriod: 120
