# job-benchmark_timing_3hr-15-2
schema_version: "batch-dataset/v1"

dataset:
  id: embedding_backfill_sample
  model: BAAI/bge-m3
  endpoint: /v1/embeddings
  request_format: embeddings
  record_count: 1280000
  seed: 202

  partitioning:
    shard_count: 128
    requests_per_shard: 10000

  io:
    input_tokens:
      distribution: lognormal
      minimum: 96
      average: 384
      maximum: 1024
      sigma: 0.8
    output_tokens:
      distribution: constant
      minimum: 1
      average: 1
      maximum: 1
