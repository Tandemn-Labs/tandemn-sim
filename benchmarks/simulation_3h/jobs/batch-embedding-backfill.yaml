# job-benchmark_timing_3hr-15-2
job:
  user_id: tenant_embeddings
  optimization_goal: throughput
  precision: fp16
  features:
    isl_token_avg: 384
    isl_token_min: 96
    isl_token_max: 1024
    isl_distribution_type: LogNormal
    osl_token_avg: 1
    osl_token_min: 1
    osl_token_max: 1
    osl_distribution_type: Constant
    request_arrival_pattern: Constant
    peak_to_mean_ratio: 1
    workload_prefix_concentration: 0
    multi_turn_ratio: 0
    shared_prefix_length_avg: 1
    is_session_affinity: false
    total_token_budget: 492800000
    priority_class: LOW
    deadline_hrs: 2.75
    target_p99_ttft_ms: 1000
    target_p99_tpot_ms: 30

schema_version: "batch-dataset/v1"

dataset:
  id: embedding_backfill_sample
  model: intfloat/multilingual-e5-large
  endpoint: /v1/embeddings
  request_format: embeddings
  record_count: 1280000
  seed: 202

  partitioning:
    shard_count: 128
    requests_per_shard: 10000
