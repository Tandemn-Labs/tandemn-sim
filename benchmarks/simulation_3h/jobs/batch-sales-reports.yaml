# job-benchmark_timing_3hr-125-2
job:
  user_id: tenant_reports
  optimization_goal: throughput
  features:
    isl_token_avg: 18000
    isl_token_min: 4500
    isl_token_max: 64000
    isl_distribution_type: LogNormal
    osl_token_avg: 1400
    osl_token_min: 350
    osl_token_max: 5000
    osl_distribution_type: LogNormal
    request_arrival_pattern: Constant
    peak_to_mean_ratio: 1
    workload_prefix_concentration: 0
    multi_turn_ratio: 0
    shared_prefix_length_avg: 1
    is_session_affinity: false
    total_token_budget: 155200000
    priority_class: LOW
    deadline_hrs: 0.9167
    target_p99_ttft_ms: 10000
    target_p99_tpot_ms: 120

schema_version: "batch-dataset/v1"

dataset:
  id: sales_reports_short
  model: Qwen/Qwen2.5-72B-Instruct
  endpoint: /v1/chat/completions
  request_format: chat
  record_count: 8000
  seed: 206

  partitioning:
    shard_count: 80
    requests_per_shard: 100

  io:
    input_tokens:
      distribution: lognormal
      minimum: 4500
      average: 18000
      maximum: 64000
      sigma: 0.8
    output_tokens:
      distribution: lognormal
      minimum: 350
      average: 1400
      maximum: 5000
      sigma: 0.8
