# job-benchmark_timing_3hr-125-2
schema_version: "batch-dataset/v1"

dataset:
  id: sales_reports_short
  model: Qwen/Qwen2.5-72B-Instruct
  endpoint: /v1/chat/completions
  request_format: chat
  record_count: 8000
  seed: 206

  partitioning:
    shard_count: 80
    requests_per_shard: 100

  io:
    input_tokens:
      distribution: lognormal
      minimum: 4500
      average: 18000
      maximum: 64000
      sigma: 0.8
    output_tokens:
      distribution: lognormal
      minimum: 350
      average: 1400
      maximum: 5000
      sigma: 0.8
