schema_version: benchmark-job/v1
job_id: job-benchmark_timing_3hr-7-2
schedule:
  enabled: true
  kind: online
  driver: aiperf
  service_id: service-benchmark_timing_3hr-7-2
  operation: base_service
  start_at_offset_minutes: 7
  stop_at_offset_minutes: 180
spec:
  user_id: tenant_small_model
  optimization_goal: latency
  precision: fp16
  features:
    isl_token_avg: 256
    isl_token_min: 64
    isl_token_max: 512
    isl_distribution_type: LogNormal
    osl_token_avg: 64
    osl_token_min: 16
    osl_token_max: 128
    osl_distribution_type: LogNormal
    request_arrival_pattern: Constant
    peak_to_mean_ratio: 1
    workload_prefix_concentration: 0
    multi_turn_ratio: 0
    shared_prefix_length_avg: 1
    is_session_affinity: false
    priority_class: STANDARD
    max_concurrent_streaming: 8
    target_p99_ttft_ms: 300
    target_p99_tpot_ms: 40
workload:
  schemaVersion: '2.0'
  randomSeed: 102
  benchmark:
    model: meta-llama/Llama-3.2-1B-Instruct
    endpoint:
      path: /v1/chat/completions
      type: chat
      streaming: true
      timeout: 120
      connectionReuse: pooled
    tokenizer:
      name: ${TOKENIZER_NAME:meta-llama/Llama-3.2-1B-Instruct}
    dataset:
      type: synthetic
      entries: 5000
      sampling: random
      prompts: null
      turns: 1
    phases:
    - name: profiling
      type: constant
      duration: 10380
      rate: 2.0
      concurrency: 8
      gracePeriod: 120
