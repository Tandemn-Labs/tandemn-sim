# Benchmark job: job-benchmark_timing_3hr-67-1
# Benchmark window: T+67 through T+157. Bursty traffic with a 5x peak/mean ratio.
# Priority: HIGH. SLO: p99 TTFT 2500 ms; p99 TPOT 45 ms.
# Traffic hypothesis: 0.300 mean RPS with highly clustered Gamma arrivals.
schemaVersion: "2.0"
randomSeed: 101

benchmark:
  model: moonshotai/Kimi-K2-Instruct
  endpoint:
    url: http://preview.invalid/v1/chat/completions
    type: chat
    streaming: true
    timeout: 900
    connectionReuse: sticky-user-sessions
  tokenizer:
    name: ${TOKENIZER_NAME:moonshotai/Kimi-K2-Instruct}
  dataset:
    type: synthetic
    entries: 256
    sampling: random
    prompts:
      isl: {mean: 1400, median: 1050, min: 350, max: 4096}
      osl: {mean: 4096, median: 3072, min: 1024, max: 12000}
    turns: 1
  phases:
    - name: profiling
      type: gamma
      duration: 5400
      rate: 0.300
      smoothness: 0.0625
      concurrency: 280
      gracePeriod: 900
