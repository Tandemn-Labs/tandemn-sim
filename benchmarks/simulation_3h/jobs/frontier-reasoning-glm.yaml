# Benchmark job: job-benchmark_timing_3hr-67-2
# Benchmark window: T+67 through T+142. Declared pattern: Bursty.
# Priority: STANDARD. SLO: p99 TTFT 2200 ms; p99 TPOT 50 ms.
# Trace: datasets/simulation_3h/traces/frontier_glm_reasoning_analysis.json
# Measured: 1.641 mean RPS, 40.000 max RPS, 1.378 interarrival CV.
# Mapping: Gamma arrivals; smoothness = 1 / interarrival CV^2.
job:
  user_id: tenant_frontier_glm
  optimization_goal: latency
  features:
    isl_token_avg: 1800
    isl_token_min: 450
    isl_token_max: 6000
    isl_distribution_type: LogNormal
    osl_token_avg: 2500
    osl_token_min: 625
    osl_token_max: 9000
    osl_distribution_type: LogNormal
    request_arrival_pattern: Bursty
    peak_to_mean_ratio: 5
    workload_prefix_concentration: 0
    multi_turn_ratio: 0
    shared_prefix_length_avg: 1
    is_session_affinity: false
    priority_class: STANDARD
    max_concurrent_streaming: 300
    target_p99_ttft_ms: 2200
    target_p99_tpot_ms: 50

schemaVersion: "2.0"
randomSeed: 102

benchmark:
  model: zai-org/GLM-4.5-Air
  endpoint:
    path: /v1/chat/completions
    type: chat
    streaming: true
    timeout: 600
    connectionReuse: pooled
  tokenizer:
    name: ${TOKENIZER_NAME:zai-org/GLM-4.5-Air}
  dataset:
    type: synthetic
    entries: 256
    sampling: random
    prompts:
      isl: {mean: 4442.944, median: 3680, min: 13, max: 51622}
      osl: {mean: 3930.863, median: 1684.5, min: 4, max: 75990}
    turns: 1
  phases:
    - name: profiling
      type: gamma
      duration: 4500
      rate: 1.641
      smoothness: 0.527
      concurrency: 300
      gracePeriod: 600
