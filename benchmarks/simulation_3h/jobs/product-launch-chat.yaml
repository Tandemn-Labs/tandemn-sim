# Benchmark job: job-benchmark_timing_3hr-49-1
# Benchmark window: T+49 through T+84. Declared pattern: Bursty.
# Priority: STANDARD. SLO: p99 TTFT 650 ms; p99 TPOT 50 ms.
# Trace: datasets/simulation_3h/traces/product_launch_chat_analysis.json
# Measured: 4.091 mean RPS, 25.000 max RPS, 3.009 interarrival CV.
# Mapping: Gamma arrivals; smoothness = 1 / interarrival CV^2.
job:
  user_id: tenant_chat_free
  optimization_goal: latency
  features:
    isl_token_avg: 850
    isl_token_min: 212
    isl_token_max: 2200
    isl_distribution_type: LogNormal
    osl_token_avg: 280
    osl_token_min: 70
    osl_token_max: 650
    osl_distribution_type: LogNormal
    request_arrival_pattern: Bursty
    peak_to_mean_ratio: 3.5
    workload_prefix_concentration: 0.5
    multi_turn_ratio: 0.7
    shared_prefix_length_avg: 212
    is_session_affinity: true
    priority_class: STANDARD
    max_concurrent_streaming: 32000
    target_p99_ttft_ms: 650
    target_p99_tpot_ms: 50

schemaVersion: "2.0"
randomSeed: 101

benchmark:
  model: mistralai/Mixtral-8x7B-Instruct-v0.1
  endpoint:
    path: /v1/chat/completions
    type: chat
    streaming: true
    timeout: 180
    connectionReuse: pooled
  tokenizer:
    name: ${TOKENIZER_NAME:mistralai/Mixtral-8x7B-Instruct-v0.1}
  dataset:
    type: synthetic
    entries: 3000
    sampling: random
    prompts:
      isl: {mean: 14.776, stddev: 44.022, min: 0, max: 219}
      osl: {mean: 1.991, stddev: 6.119, min: 0, max: 39}
    turns: 1
  phases:
    - name: profiling
      type: gamma
      duration: 2100
      rate: 4.091
      smoothness: 0.110
      concurrency: 32000
      gracePeriod: 180
