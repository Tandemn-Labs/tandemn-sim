# Benchmark job: job-benchmark_timing_3hr-49-1
# Benchmark window: T+49 through T+84. Bursty traffic with a 3.5x peak/mean ratio.
# Priority: STANDARD. SLO: p99 TTFT 650 ms; p99 TPOT 50 ms.
# Traffic hypothesis: 624.086 mean RPS with clustered Gamma arrivals.
schemaVersion: "2.0"
randomSeed: 101

benchmark:
  model: meta-llama/Llama-3.1-8B-Instruct
  endpoint:
    url: http://preview.invalid/v1/chat/completions
    type: chat
    streaming: true
    timeout: 180
    connectionReuse: sticky-user-sessions
  tokenizer:
    name: ${TOKENIZER_NAME:meta-llama/Llama-3.1-8B-Instruct}
  dataset:
    type: synthetic
    entries: 3000
    sampling: random
    prompts:
      isl: {mean: 638, median: 478, min: 1, max: 1988}
      osl: {mean: 280, median: 210, min: 70, max: 650}
    prefixPrompts: {poolSize: 32, length: 212}
    turns: {peaks: [{value: 1, weight: 30}, {value: 4, weight: 70}]}
  phases:
    - name: profiling
      type: gamma
      duration: 2100
      rate: 624.086
      smoothness: 0.16
      concurrency: 32000
      gracePeriod: 180
