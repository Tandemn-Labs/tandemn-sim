# Benchmark job: job-benchmark_timing_3hr-0-1
# Benchmark window: T+0 through T+180. Diurnal traffic with a 2x peak/mean ratio.
# Priority: LOW. SLO: p99 TTFT 700 ms; p99 TPOT 55 ms.
# Traffic hypothesis: ramp to 697.674 RPS; the full-window ramp yields a 2x peak/mean ratio.
schemaVersion: "2.0"
randomSeed: 101

benchmark:
  model: Qwen/Qwen2.5-1.5B-Instruct
  endpoint:
    url: http://preview.invalid/v1/chat/completions
    type: chat
    streaming: true
    timeout: 120
    connectionReuse: sticky-user-sessions
  tokenizer:
    name: ${TOKENIZER_NAME:Qwen/Qwen2.5-1.5B-Instruct}
  dataset:
    type: synthetic
    entries: 2000
    sampling: random
    prompts:
      isl: {mean: 675, median: 506, min: 1, max: 1975}
      osl: {mean: 300, median: 225, min: 75, max: 700}
    prefixPrompts: {poolSize: 32, length: 225}
    turns: {peaks: [{value: 1, weight: 30}, {value: 4, weight: 70}]}
  phases:
    - name: profiling
      type: poisson
      duration: 10800
      rate: 697.674
      concurrency: 12000
      rateRamp: 10800
      gracePeriod: 120
