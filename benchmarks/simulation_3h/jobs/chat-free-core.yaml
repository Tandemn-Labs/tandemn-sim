# Benchmark job: job-benchmark_timing_3hr-0-1
# Benchmark window: T+0 through T+180. Declared pattern: Diurnal.
# Priority: LOW. SLO: p99 TTFT 700 ms; p99 TPOT 55 ms.
# Trace: datasets/simulation_3h/traces/chat_free_analysis.json
# Measured: 37.081 mean RPS, 73.000 max RPS.
# Mapping: full-window Gamma traffic at the measured mean RPS.
# Smoothness is calibrated from second-level variance after removing the
# trace's 10-minute rate envelope.
job:
  user_id: tenant_chat_free
  optimization_goal: latency
  features:
    isl_token_avg: 900
    isl_token_min: 225
    isl_token_max: 2200
    isl_distribution_type: LogNormal
    osl_token_avg: 300
    osl_token_min: 75
    osl_token_max: 700
    osl_distribution_type: LogNormal
    request_arrival_pattern: Diurnal
    peak_to_mean_ratio: 2
    workload_prefix_concentration: 0.5
    multi_turn_ratio: 0.7
    shared_prefix_length_avg: 225
    is_session_affinity: true
    priority_class: LOW
    max_concurrent_streaming: 12000
    target_p99_ttft_ms: 700
    target_p99_tpot_ms: 55

schemaVersion: "2.0"
randomSeed: 101

benchmark:
  model: meta-llama/Llama-3.2-1B-Instruct
  endpoint:
    path: /v1/chat/completions
    type: chat
    streaming: true
    timeout: 120
    connectionReuse: pooled
  tokenizer:
    name: ${TOKENIZER_NAME:meta-llama/Llama-3.2-1B-Instruct}
  dataset:
    type: synthetic
    entries: 2000
    sampling: random
    prompts:
      isl: {mean: 1685.737, median: 918, min: 6, max: 7999}
      osl: {mean: 107.797, median: 41, min: 1, max: 1200}
    turns: 1
  phases:
    - name: profiling
      type: gamma
      duration: 10800
      rate: 37.081
      smoothness: 0.894
      concurrency: 12000
      gracePeriod: 120
