# Benchmark job: job-benchmark_timing_3hr-32-1
# Benchmark window: T+32 through T+87. Bursty traffic with a 3.5x peak/mean ratio.
# Priority: STANDARD. SLO: p99 TTFT 160 ms; p99 TPOT 45 ms.
# Traffic hypothesis: 829.082 mean RPS with clustered Gamma arrivals.
schemaVersion: "2.0"
randomSeed: 101

benchmark:
  model: Qwen/Qwen2.5-Coder-32B-Instruct
  endpoint:
    url: http://preview.invalid/v1/chat/completions
    type: chat
    streaming: true
    timeout: 120
    connectionReuse: pooled
  tokenizer:
    name: ${TOKENIZER_NAME:Qwen/Qwen2.5-Coder-32B-Instruct}
  dataset:
    type: synthetic
    entries: 2000
    sampling: random
    prompts:
      isl: {mean: 2200, median: 1650, min: 550, max: 6000}
      osl: {mean: 96, median: 72, min: 24, max: 280}
    turns: 1
  phases:
    - name: profiling
      type: gamma
      duration: 3300
      rate: 829.082
      smoothness: 0.16
      concurrency: 13000
      gracePeriod: 120
