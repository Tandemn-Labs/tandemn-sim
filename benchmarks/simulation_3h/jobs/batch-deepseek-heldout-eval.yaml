# job-benchmark_timing_3hr-145-2
job:
  user_id: tenant_new_model_eval
  optimization_goal: throughput
  features:
    isl_token_avg: 1800
    isl_token_min: 450
    isl_token_max: 6000
    isl_distribution_type: LogNormal
    osl_token_avg: 1600
    osl_token_min: 400
    osl_token_max: 6000
    osl_distribution_type: LogNormal
    request_arrival_pattern: Constant
    peak_to_mean_ratio: 1
    workload_prefix_concentration: 0
    multi_turn_ratio: 0
    shared_prefix_length_avg: 1
    is_session_affinity: false
    total_token_budget: 21760000
    priority_class: STANDARD
    deadline_hrs: 0.5833
    target_p99_ttft_ms: 12000
    target_p99_tpot_ms: 160

schema_version: "batch-dataset/v1"

dataset:
  id: heldout_frontier_eval
  model: deepseek-ai/DeepSeek-V3
  endpoint: /v1/chat/completions
  request_format: chat
  record_count: 6400
  seed: 207

  partitioning:
    shard_count: 32
    requests_per_shard: 200

  io:
    input_tokens:
      distribution: lognormal
      minimum: 450
      average: 1800
      maximum: 6000
      sigma: 0.8
    output_tokens:
      distribution: lognormal
      minimum: 400
      average: 1600
      maximum: 6000
      sigma: 0.8
