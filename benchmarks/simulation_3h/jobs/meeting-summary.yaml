# Benchmark job: job-benchmark_timing_3hr-125-1
# Benchmark window: T+125 through T+170. Declared pattern: Bursty.
# Priority: STANDARD. SLO: p99 TTFT 3000 ms; p99 TPOT 65 ms.
# Trace: datasets/simulation_3h/traces/meeting_summary_analysis.json
# Measured: 0.003 mean RPS and nine requests at one source timestamp.
# Mapping: Gamma arrivals with minimum smoothness to preserve an extreme cluster.
job:
  user_id: tenant_meeting_summary
  optimization_goal: latency
  precision: fp16
  features:
    isl_token_avg: 24000
    isl_token_min: 6000
    isl_token_max: 128000
    isl_distribution_type: LogNormal
    osl_token_avg: 1200
    osl_token_min: 300
    osl_token_max: 4000
    osl_distribution_type: LogNormal
    request_arrival_pattern: Bursty
    peak_to_mean_ratio: 3.5
    workload_prefix_concentration: 0
    multi_turn_ratio: 0
    shared_prefix_length_avg: 1
    is_session_affinity: false
    priority_class: STANDARD
    max_concurrent_streaming: 180
    target_p99_ttft_ms: 3000
    target_p99_tpot_ms: 65

schemaVersion: "2.0"
randomSeed: 101

benchmark:
  model: Qwen/Qwen3-Next-80B-A3B-Thinking
  endpoint:
    path: /v1/chat/completions
    type: chat
    streaming: true
    timeout: 1200
    connectionReuse: pooled
  tokenizer:
    name: ${TOKENIZER_NAME:Qwen/Qwen3-Next-80B-A3B-Thinking}
  dataset:
    type: synthetic
    entries: 64
    sampling: random
    prompts:
    turns: 1
  phases:
    - name: profiling
      type: gamma
      duration: 2700
      rate: 0.003
      smoothness: 0.001
      concurrency: 180
      gracePeriod: 1200
