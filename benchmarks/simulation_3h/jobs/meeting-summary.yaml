# Benchmark job: job-benchmark_timing_3hr-125-1
# Benchmark window: T+125 through T+170. Bursty traffic with a 3.5x peak/mean ratio.
# Priority: STANDARD. SLO: p99 TTFT 3000 ms; p99 TPOT 65 ms.
# Traffic hypothesis: 0.635 mean RPS with clustered Gamma arrivals.
schemaVersion: "2.0"
randomSeed: 101

benchmark:
  model: Qwen/Qwen2.5-72B-Instruct
  endpoint:
    url: http://preview.invalid/v1/chat/completions
    type: chat
    streaming: true
    timeout: 1200
    connectionReuse: pooled
  tokenizer:
    name: ${TOKENIZER_NAME:Qwen/Qwen2.5-72B-Instruct}
  dataset:
    type: synthetic
    entries: 64
    sampling: random
    prompts:
      isl: {mean: 24000, median: 18000, min: 6000, max: 128000}
      osl: {mean: 1200, median: 900, min: 300, max: 4000}
    turns: 1
  phases:
    - name: profiling
      type: gamma
      duration: 2700
      rate: 0.635
      smoothness: 0.16
      concurrency: 180
      gracePeriod: 1200
