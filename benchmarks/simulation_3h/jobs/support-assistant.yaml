# Benchmark job: job-benchmark_timing_3hr-7-3
# Benchmark window: T+7 through T+180. Bursty traffic with a 3.5x peak/mean ratio.
# Priority: STANDARD. SLO: p99 TTFT 700 ms; p99 TPOT 50 ms.
# Traffic hypothesis: 70.644 mean RPS with clustered Gamma arrivals.
schemaVersion: "2.0"
randomSeed: 103

benchmark:
  model: meta-llama/Llama-3.1-8B-Instruct
  endpoint:
    url: http://preview.invalid/v1/chat/completions
    type: chat
    streaming: true
    timeout: 180
    connectionReuse: sticky-user-sessions
  tokenizer:
    name: ${TOKENIZER_NAME:meta-llama/Llama-3.1-8B-Instruct}
  dataset:
    type: synthetic
    entries: 1500
    sampling: random
    prompts:
      isl: {mean: 1050, median: 788, min: 1, max: 5650}
      osl: {mean: 350, median: 262, min: 87, max: 1000}
    prefixPrompts: {poolSize: 32, length: 350}
    turns: {peaks: [{value: 1, weight: 70}, {value: 3, weight: 30}]}
  phases:
    - name: profiling
      type: gamma
      duration: 10380
      rate: 70.644
      smoothness: 0.16
      concurrency: 4500
      gracePeriod: 180
