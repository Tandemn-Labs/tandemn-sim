# Benchmark job: job-benchmark_timing_3hr-7-3
# Benchmark window: T+7 through T+180. Declared pattern: Bursty.
# Priority: STANDARD. SLO: p99 TTFT 700 ms; p99 TPOT 50 ms.
# Trace: datasets/simulation_3h/traces/support_assistant_analysis.json
# Measured: 0.009 mean RPS, 1.000 max RPS, 1.605 interarrival CV.
# Mapping: Gamma arrivals; smoothness = 1 / interarrival CV^2.
job:
  user_id: tenant_support
  optimization_goal: latency
  precision: fp16
  features:
    isl_token_avg: 1400
    isl_token_min: 350
    isl_token_max: 6000
    isl_distribution_type: LogNormal
    osl_token_avg: 350
    osl_token_min: 87
    osl_token_max: 1000
    osl_distribution_type: LogNormal
    request_arrival_pattern: Bursty
    peak_to_mean_ratio: 3.5
    workload_prefix_concentration: 0.5
    multi_turn_ratio: 0.3
    shared_prefix_length_avg: 350
    is_session_affinity: true
    priority_class: STANDARD
    max_concurrent_streaming: 4500
    target_p99_ttft_ms: 700
    target_p99_tpot_ms: 50

schemaVersion: "2.0"
randomSeed: 103

benchmark:
  model: mistralai/Mixtral-8x7B-Instruct-v0.1
  endpoint:
    path: /v1/chat/completions
    type: chat
    streaming: true
    timeout: 180
    connectionReuse: pooled
  tokenizer:
    name: ${TOKENIZER_NAME:mistralai/Mixtral-8x7B-Instruct-v0.1}
  dataset:
    type: synthetic
    entries: 1500
    sampling: random
    prompts:
    turns: 1
  phases:
    - name: profiling
      type: gamma
      duration: 10380
      rate: 0.009
      smoothness: 0.388
      concurrency: 4500
      gracePeriod: 180
