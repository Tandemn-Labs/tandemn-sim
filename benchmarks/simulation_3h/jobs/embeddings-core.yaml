schema_version: benchmark-job/v1
job_id: job-benchmark_timing_3hr-0-5
schedule:
  enabled: true
  kind: online
  driver: aiperf
  service_id: service-benchmark_timing_3hr-0-5
  operation: base_service
  start_at_offset_minutes: 0
  stop_at_offset_minutes: 180
spec:
  user_id: tenant_embeddings
  optimization_goal: latency
  precision: fp16
  features:
    isl_token_avg: 384
    isl_token_min: 96
    isl_token_max: 1024
    isl_distribution_type: LogNormal
    osl_token_avg: 1
    osl_token_min: 1
    osl_token_max: 1
    osl_distribution_type: Constant
    request_arrival_pattern: Constant
    peak_to_mean_ratio: 1
    workload_prefix_concentration: 0
    multi_turn_ratio: 0
    shared_prefix_length_avg: 1
    is_session_affinity: false
    priority_class: STANDARD
    max_concurrent_streaming: 40000
    target_p99_ttft_ms: 120
    target_p99_tpot_ms: 1
workload:
  schemaVersion: '2.0'
  randomSeed: 105
  benchmark:
    model: intfloat/multilingual-e5-large
    endpoint:
      path: /v1/embeddings
      type: embeddings
      streaming: false
      timeout: 120
      connectionReuse: pooled
    tokenizer:
      name: ${TOKENIZER_NAME:intfloat/multilingual-e5-large}
    dataset:
      type: synthetic
      entries: 5000
      sampling: random
      prompts:
        batchSize: 1
    phases:
    - name: profiling
      type: constant
      duration: 10800
      rate: 0.025
      concurrency: 40000
      gracePeriod: 120
