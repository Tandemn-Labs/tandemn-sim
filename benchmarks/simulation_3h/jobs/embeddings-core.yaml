# Benchmark job: job-benchmark_timing_3hr-0-5
# Benchmark window: T+0 through T+180. Declared pattern: Constant.
# Priority: STANDARD. SLO: p99 TTFT 120 ms; p99 TPOT 1 ms.
# Trace: datasets/simulation_3h/traces/embeddings_analysis.json
# Measured: 0.025 mean RPS, 2.000 max RPS, 6.596 mean input tokens.
# Mapping: fixed interarrival timing at the measured mean request rate.
job:
  user_id: tenant_embeddings
  optimization_goal: latency
  features:
    isl_token_avg: 384
    isl_token_min: 96
    isl_token_max: 1024
    isl_distribution_type: LogNormal
    osl_token_avg: 1
    osl_token_min: 1
    osl_token_max: 1
    osl_distribution_type: Constant
    request_arrival_pattern: Constant
    peak_to_mean_ratio: 1
    workload_prefix_concentration: 0
    multi_turn_ratio: 0
    shared_prefix_length_avg: 1
    is_session_affinity: false
    priority_class: STANDARD
    max_concurrent_streaming: 40000
    target_p99_ttft_ms: 120
    target_p99_tpot_ms: 1

schemaVersion: "2.0"
randomSeed: 105

benchmark:
  model: BAAI/bge-m3
  endpoint:
    path: /v1/embeddings
    type: embeddings
    streaming: false
    timeout: 120
    connectionReuse: pooled
  tokenizer:
    name: ${TOKENIZER_NAME:BAAI/bge-m3}
  dataset:
    type: synthetic
    entries: 5000
    sampling: random
    prompts:
      isl: {mean: 6.596, median: 6, min: 1, max: 26}
      osl: 0
      batchSize: 1
  phases:
    - name: profiling
      type: constant
      duration: 10800
      rate: 0.025
      concurrency: 40000
      gracePeriod: 120
