# Benchmark job: job-benchmark_timing_3hr-0-3
# Benchmark window: T+0 through T+180. Bursty traffic with a 3.5x peak/mean ratio.
# Priority: STANDARD. SLO: p99 TTFT 180 ms; p99 TPOT 45 ms.
# Traffic hypothesis: 256.016 mean RPS with clustered Gamma arrivals.
schemaVersion: "2.0"
randomSeed: 103

benchmark:
  model: Qwen/Qwen2.5-Coder-32B-Instruct
  endpoint:
    url: http://preview.invalid/v1/chat/completions
    type: chat
    streaming: true
    timeout: 120
    connectionReuse: pooled
  tokenizer:
    name: ${TOKENIZER_NAME:Qwen/Qwen2.5-Coder-32B-Instruct}
  dataset:
    type: synthetic
    entries: 2000
    sampling: random
    prompts:
      isl: {mean: 1800, median: 1350, min: 450, max: 5000}
      osl: {mean: 120, median: 90, min: 30, max: 350}
    turns: 1
  phases:
    - name: profiling
      type: gamma
      duration: 10800
      rate: 256.016
      smoothness: 0.16
      concurrency: 5000
      gracePeriod: 120
