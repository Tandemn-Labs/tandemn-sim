# Benchmark job: job-benchmark_timing_3hr-0-3
# Benchmark window: T+0 through T+180. Declared pattern: Bursty.
# Priority: STANDARD. SLO: p99 TTFT 180 ms; p99 TPOT 45 ms.
# Trace: datasets/simulation_3h/traces/code_autocomplete_analysis.json
# Measured: 5.974 mean RPS, 19.000 max RPS, 1.013 interarrival CV.
# Mapping: Gamma arrivals; smoothness = 1 / interarrival CV^2.
schemaVersion: "2.0"
randomSeed: 103

benchmark:
  model: Qwen/Qwen2.5-Coder-32B-Instruct
  endpoint:
    path: /v1/chat/completions
    type: chat
    streaming: true
    timeout: 120
    connectionReuse: pooled
  tokenizer:
    name: ${TOKENIZER_NAME:Qwen/Qwen2.5-Coder-32B-Instruct}
  dataset:
    type: synthetic
    entries: 2000
    sampling: random
    prompts:
      isl: {mean: 5747.656, median: 4540, min: 9, max: 25777}
      osl: {mean: 808.257, median: 469, min: 1, max: 35031}
    turns: 1
  phases:
    - name: profiling
      type: gamma
      duration: 10800
      rate: 5.974
      smoothness: 0.974
      concurrency: 5000
      gracePeriod: 120
