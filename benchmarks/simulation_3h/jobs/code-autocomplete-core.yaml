# Benchmark job: job-benchmark_timing_3hr-0-3
# Benchmark window: T+0 through T+180. Declared pattern: Bursty.
# Priority: STANDARD. SLO: p99 TTFT 180 ms; p99 TPOT 45 ms.
# Trace: datasets/simulation_3h/traces/code_autocomplete_analysis.json
# Measured: 5.974 mean RPS, 19.000 max RPS, 1.013 interarrival CV.
# Mapping: Gamma arrivals; smoothness = 1 / interarrival CV^2.
job:
  user_id: tenant_code_autocomplete
  optimization_goal: latency
  precision: fp16
  features:
    isl_token_avg: 1800
    isl_token_min: 450
    isl_token_max: 5000
    isl_distribution_type: LogNormal
    osl_token_avg: 120
    osl_token_min: 30
    osl_token_max: 350
    osl_distribution_type: LogNormal
    request_arrival_pattern: Bursty
    peak_to_mean_ratio: 3.5
    workload_prefix_concentration: 0
    multi_turn_ratio: 0
    shared_prefix_length_avg: 1
    is_session_affinity: false
    priority_class: STANDARD
    max_concurrent_streaming: 5000
    target_p99_ttft_ms: 180
    target_p99_tpot_ms: 45

schemaVersion: "2.0"
randomSeed: 103

benchmark:
  model: Qwen/Qwen2.5-Coder-32B-Instruct
  endpoint:
    path: /v1/chat/completions
    type: chat
    streaming: true
    timeout: 120
    connectionReuse: pooled
  tokenizer:
    name: ${TOKENIZER_NAME:Qwen/Qwen2.5-Coder-32B-Instruct}
  dataset:
    type: synthetic
    entries: 2000
    sampling: random
    prompts:
    turns: 1
  phases:
    - name: profiling
      type: gamma
      duration: 10800
      rate: 5.974
      smoothness: 0.974
      concurrency: 5000
      gracePeriod: 120
