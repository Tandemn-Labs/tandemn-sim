# Benchmark job: job-benchmark_timing_3hr-0-4
# Benchmark window: T+0 through T+180. Declared pattern: Bursty.
# Priority: HIGH. SLO: p99 TTFT 100 ms; p99 TPOT 30 ms.
# Trace: datasets/simulation_3h/traces/safety_moderation_analysis.json
# Measured: 3.286 mean RPS, 35.000 max RPS, 20.398 interarrival CV.
# Mapping: Gamma arrivals; smoothness = 1 / interarrival CV^2.
job:
  user_id: tenant_safety_moderation
  optimization_goal: latency
  precision: fp16
  features:
    isl_token_avg: 256
    isl_token_min: 64
    isl_token_max: 1024
    isl_distribution_type: LogNormal
    osl_token_avg: 8
    osl_token_min: 2
    osl_token_max: 32
    osl_distribution_type: LogNormal
    request_arrival_pattern: Bursty
    peak_to_mean_ratio: 3.5
    workload_prefix_concentration: 0
    multi_turn_ratio: 0
    shared_prefix_length_avg: 1
    is_session_affinity: false
    priority_class: HIGH
    max_concurrent_streaming: 25000
    target_p99_ttft_ms: 100
    target_p99_tpot_ms: 30

schemaVersion: "2.0"
randomSeed: 104

benchmark:
  model: meta-llama/Llama-3.2-1B-Instruct
  endpoint:
    path: /v1/chat/completions
    type: chat
    streaming: true
    timeout: 120
    connectionReuse: pooled
  tokenizer:
    name: ${TOKENIZER_NAME:meta-llama/Llama-3.2-1B-Instruct}
  dataset:
    type: synthetic
    entries: 5000
    sampling: random
    prompts:
    turns: 1
  phases:
    - name: profiling
      type: gamma
      duration: 10800
      rate: 3.286
      smoothness: 0.002
      concurrency: 25000
      gracePeriod: 120
