# Benchmark job: job-benchmark_timing_3hr-67-3
# Benchmark window: T+67 through T+142. Declared pattern: Bursty.
# Priority: STANDARD. SLO: p99 TTFT 1000 ms; p99 TPOT 45 ms.
# Trace: datasets/simulation_3h/traces/moe_routing_qwen3_analysis.json
# Measured: 24.019 mean RPS, 52.000 max RPS, 1.044 interarrival CV.
# Mapping: Gamma arrivals; smoothness = 1 / interarrival CV^2.
job:
  user_id: tenant_moe_routing
  optimization_goal: latency
  precision: fp16
  features:
    isl_token_avg: 1200
    isl_token_min: 300
    isl_token_max: 4096
    isl_distribution_type: LogNormal
    osl_token_avg: 900
    osl_token_min: 225
    osl_token_max: 3000
    osl_distribution_type: LogNormal
    request_arrival_pattern: Bursty
    peak_to_mean_ratio: 5
    workload_prefix_concentration: 0
    multi_turn_ratio: 0
    shared_prefix_length_avg: 1
    is_session_affinity: false
    priority_class: STANDARD
    max_concurrent_streaming: 900
    target_p99_ttft_ms: 1000
    target_p99_tpot_ms: 45

schemaVersion: "2.0"
randomSeed: 103

benchmark:
  model: Qwen/Qwen3-Next-80B-A3B-Thinking
  endpoint:
    path: /v1/chat/completions
    type: chat
    streaming: true
    timeout: 300
    connectionReuse: pooled
  tokenizer:
    name: ${TOKENIZER_NAME:Qwen/Qwen3-Next-80B-A3B-Thinking}
  dataset:
    type: synthetic
    entries: 512
    sampling: random
    prompts:
    turns: 1
  phases:
    - name: profiling
      type: gamma
      duration: 4500
      rate: 24.019
      smoothness: 0.917
      concurrency: 900
      gracePeriod: 300
