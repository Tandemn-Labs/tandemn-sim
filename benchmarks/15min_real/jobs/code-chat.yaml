schema_version: benchmark-job/v1
job_id: job-benchmark_timing_15min_real-0-1
schedule:
  enabled: true
  kind: online
  driver: aiperf
  service_id: service-benchmark_timing_15min_real-0-1
  operation: base_service
  start_at_offset_minutes: 0
  stop_at_offset_minutes: 30
spec:
  user_id: tenant_smoke
  optimization_goal: latency
  precision: fp16
  features:
    isl_token_avg: 1800
    isl_token_min: 450
    isl_token_max: 5000
    isl_distribution_type: LogNormal
    osl_token_avg: 120
    osl_token_min: 30
    osl_token_max: 350
    osl_distribution_type: LogNormal
    request_arrival_pattern: Poisson
    peak_to_mean_ratio: 1
    workload_prefix_concentration: 0
    multi_turn_ratio: 0
    shared_prefix_length_avg: 1
    is_session_affinity: false
    priority_class: STANDARD
    max_concurrent_streaming: 8
    target_p99_ttft_ms: 500
    target_p99_tpot_ms: 50
workload:
  schemaVersion: '2.0'
  randomSeed: 24015
  benchmark:
    model: Qwen/Qwen2.5-Coder-32B-Instruct
    endpoint:
      path: /v1/chat/completions
      type: chat
      streaming: true
      timeout: 180
      connectionReuse: pooled
    tokenizer:
      name: ${TOKENIZER_NAME:Qwen/Qwen2.5-Coder-32B-Instruct}
    dataset:
      type: synthetic
      entries: 2000
      sampling: random
      prompts: null
      turns: 1
    phases:
    - name: profiling
      type: poisson
      duration: 1800
      rate: 0.5
      concurrency: 8
      gracePeriod: 60
