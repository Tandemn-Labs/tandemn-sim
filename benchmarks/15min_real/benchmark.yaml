schema_version: "benchmark-manifest/v1"

benchmark:
  id: 15min_real
  environment: real_hardware
  duration_minutes: 15
  status: executable
  definition: benchmark.md
  jobs: jobs
  resources: resources.yaml
  clock: time.time
  drain_minutes: 1
  poll_interval_seconds: 10
  shutdown_grace_seconds: 60
  reoptimization_tick_minutes: 1
  dispatch_at_exact_offset: false
  online_stop_action: stop_new_requests_and_drain_in_flight
  hard_stop_at_offset_minutes: 31
