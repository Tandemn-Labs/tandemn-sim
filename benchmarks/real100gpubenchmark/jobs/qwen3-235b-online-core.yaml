schema_version: benchmark-job/v1
job_id: job-benchmark_timing_real100gpu-0-6-parallel
schedule:
  enabled: true
  kind: online
  driver: aiperf
  service_id: service-benchmark_timing_real100gpu-0-6
  operation: base_service
  start_at_offset_minutes: 75
  stop_at_offset_minutes: 180
spec:
  user_id: tenant_qwen3_online_core
  optimization_goal: latency
  precision: fp16
  features:
    isl_token_avg: 3200
    isl_token_min: 800
    isl_token_max: 10000
    isl_distribution_type: LogNormal
    osl_token_avg: 800
    osl_token_min: 200
    osl_token_max: 3000
    osl_distribution_type: LogNormal
    request_arrival_pattern: Diurnal
    peak_to_mean_ratio: 2
    workload_prefix_concentration: 0.35
    multi_turn_ratio: 0.3
    shared_prefix_length_avg: 400
    is_session_affinity: true
    priority_class: STANDARD
    max_concurrent_streaming: 24
    target_p99_ttft_ms: 2500
    target_p99_tpot_ms: 80
workload:
  schemaVersion: '2.0'
  randomSeed: 110
  benchmark:
    model: QuantTrio/Qwen3-235B-A22B-Instruct-2507-AWQ
    endpoint:
      path: /v1/chat/completions
      type: chat
      streaming: true
      timeout: 600
      connectionReuse: pooled
    tokenizer:
      name: ${TOKENIZER_NAME:QuantTrio/Qwen3-235B-A22B-Instruct-2507-AWQ}
    dataset:
      type: synthetic
      entries: 1000
      sampling: random
      prompts: null
      turns: 1
    phases:
    - name: profiling
      type: gamma
      duration: 6300
      rate: 0.18
      smoothness: 0.5
      concurrency: 24
      gracePeriod: 600
