schema_version: benchmark-job/v1
job_id: job-benchmark_timing_real100gpu-0-7-parallel
schedule:
  enabled: true
  kind: online
  driver: aiperf
  service_id: service-benchmark_timing_real100gpu-0-7
  operation: base_service
  start_at_offset_minutes: 90
  stop_at_offset_minutes: 180
spec:
  user_id: tenant_qwen3_online_bursty
  optimization_goal: latency
  precision: fp16
  features:
    isl_token_avg: 1800
    isl_token_min: 450
    isl_token_max: 6000
