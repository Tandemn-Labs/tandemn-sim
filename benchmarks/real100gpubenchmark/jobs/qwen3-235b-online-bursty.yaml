      name: ${TOKENIZER_NAME:QuantTrio/Qwen3-235B-A22B-Instruct-2507-AWQ}
    dataset:
      type: synthetic
      entries: 512
      sampling: random
      prompts: null
      turns: 1
    phases:
    - name: profiling
      type: gamma
      duration: 5400
      rate: 0.24
      smoothness: 0.25
      concurrency: 16
      gracePeriod: 600
