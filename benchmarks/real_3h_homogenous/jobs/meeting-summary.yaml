schema_version: benchmark-job/v1
job_id: job-benchmark_timing_real_3hr_homogenous-125-1
schedule:
  enabled: true
  kind: online
  driver: aiperf
  service_id: service-benchmark_timing_real_3hr_homogenous-125-1
  operation: base_service
  start_at_offset_minutes: 125
  stop_at_offset_minutes: 170
spec:
  user_id: tenant_meeting_summary
  optimization_goal: latency
  precision: fp16
  features:
    isl_token_avg: 24000
    isl_token_min: 6000
    isl_token_max: 128000
    isl_distribution_type: LogNormal
    osl_token_avg: 1200
    osl_token_min: 300
    osl_token_max: 4000
    osl_distribution_type: LogNormal
    request_arrival_pattern: Bursty
    peak_to_mean_ratio: 3.5
    workload_prefix_concentration: 0
    multi_turn_ratio: 0
    shared_prefix_length_avg: 1
    is_session_affinity: false
    priority_class: STANDARD
    max_concurrent_streaming: 8
    target_p99_ttft_ms: 3000
    target_p99_tpot_ms: 65
workload:
  schemaVersion: '2.0'
  randomSeed: 101
  benchmark:
    model: Qwen/Qwen3-Next-80B-A3B-Thinking
    endpoint:
      path: /v1/chat/completions
      type: chat
      streaming: true
      timeout: 1200
      connectionReuse: pooled
    tokenizer:
      name: ${TOKENIZER_NAME:Qwen/Qwen3-Next-80B-A3B-Thinking}
    dataset:
      type: synthetic
      entries: 64
      sampling: random
      prompts: null
      turns: 1
    phases:
    - name: profiling
      type: gamma
      duration: 2700
      rate: 0.06
      smoothness: 0.001
      concurrency: 8
      gracePeriod: 1200
