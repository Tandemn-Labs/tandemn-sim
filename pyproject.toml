[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "data-generation"
version = "0.1.0"
description = "Run benchmark jobs and generate their request data."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiperf==0.11.0",
    "python-dotenv>=1.0,<2",
    "tandemn-orca",
    "tandemn-store",
    "pyyaml>=6.0,<7",
]

[project.scripts]
benchmark = "data_generation.cli:main"
controller = "data_generation.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.16",
  "pre-commit>=4.2",
  "ruff>=0.12",
  "types-pyyaml>=6.0",
]
openai = [
  "openai>=2,<3",
]
dynamo = [
  "aiconfigurator @ git+https://github.com/ai-dynamo/aiconfigurator.git@4b0a812c3fb9ea0b679206af442a7107a2583b07",
  "aiconfigurator-core @ git+https://github.com/ai-dynamo/aiconfigurator.git@4b0a812c3fb9ea0b679206af442a7107a2583b07#subdirectory=aic-core",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
tandemn-orca = { path = "../Tandemn-orca", editable = true }
tandemn-store = { path = "../tandemn-store", editable = true }

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true

[[tool.mypy.overrides]]
module = ["aiconfigurator.*", "aiperf.*", "tandemn_system_data.*"]
ignore_missing_imports = true
