[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "data-generation"
version = "0.1.0"
description = "Launch AIPerf for one benchmark job."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiperf==0.11.0",
    "pyyaml>=6.0,<7",
]

[project.scripts]
controller = "data_generation.controller:main"

[dependency-groups]
agentic = [
    "claude-agent-sdk>=0.2.136",
]
openevolve = [
    "openevolve>=0.2.27",
]
dev = [
  "mypy>=1.16",
  "pre-commit>=4.2",
  "ruff>=0.12",
  "types-pyyaml>=6.0",
]
[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
