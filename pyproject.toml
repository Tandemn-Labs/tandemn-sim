[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "data-generation"
version = "0.1.0"
description = "Launch AIPerf for one benchmark job."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiconfigurator>=0.11",
    "aiperf==0.11.0",
    "huggingface-hub>=1.24,<2",
    "openai>=3.3",
    "openevolve>=0.2.27",
    "ortools>=9.14",
    "pyyaml>=6.0,<7",
    "skydiscover",
    "sqlalchemy>=2.0",
    "tandemn-store",
    "tandemn-orca",
]

[project.scripts]
controller = "data_generation.controller:main"
real-scenario = "data_generation.real_scenario:main"

[dependency-groups]
agentic = [
    "claude-agent-sdk>=0.2.136",
]
dev = [
  "mypy>=1.16",
  "pre-commit>=4.2",
  "ruff>=0.12",
  "types-pyyaml>=6.0",
]

[tool.uv.sources]
skydiscover = { git = "https://github.com/skydiscover-ai/skydiscover.git", rev = "59643ef8e7aa9ae071e86028d9ba56849fad0d80" }
tandemn-store = { path = "../tandemn-store", editable = true }
tandemn-orca = { path = "../tandemn-system", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true

[[tool.mypy.overrides]]
module = ["tandemn_orca.*", "tandemn_system_data.*"]
ignore_missing_imports = true
