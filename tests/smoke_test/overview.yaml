# Three-minute, low-volume version of the three-hour online simulation.
schema_version: "benchmark/v1"

benchmark:
  id: simulation_3h_smoke
  source_benchmark: ../../benchmarks/simulation_3h/benchmark.md
  poll_interval_seconds: 1
  shutdown_grace_seconds: 5
  hard_stop_at_offset_minutes: 3.25

jobs:
  terminal-request-sink:
    enabled: true
    output_to_terminal: true
    kind: online
    driver: external_mock_data
    config: print_sink.py
    command:
      - .venv/bin/python
      - tests/smoke_test/print_sink.py
    start_at_offset_minutes: 0
    stop_at_offset_minutes: 3.1

  job-benchmark_timing_3hr-0-1:
    enabled: true
    kind: online
    driver: aiperf
    config: jobs/chat-free-core.yaml
    start_at_offset_minutes: 0.05
    stop_at_offset_minutes: 3.05

  job-benchmark_timing_3hr-0-2:
    enabled: true
    kind: online
    driver: aiperf
    config: jobs/chat-premium-core.yaml
    start_at_offset_minutes: 0.05
    stop_at_offset_minutes: 3.05

  job-benchmark_timing_3hr-0-3:
