# Benchmark job: job-benchmark_timing_3hr-0-3
# Benchmark window: T+0 through T+180. Bursty traffic with a 3.5x peak/mean ratio.
# Priority: STANDARD. SLO: p99 TTFT 180 ms; p99 TPOT 45 ms.
# Smoke traffic: 1 mean RPS with the production Gamma burst shape.
schemaVersion: "2.0"
randomSeed: 103

benchmark:
  model: Qwen/Qwen2.5-Coder-32B-Instruct
  endpoint:
    url: http://127.0.0.1:8765/v1/chat/completions
    type: chat
    streaming: true
    timeout: 30
    connectionReuse: pooled
  tokenizer:
    name: builtin
  dataset:
    type: synthetic
    entries: 100
    sampling: random
    prompts:
      isl: {mean: 1800, median: 1350, min: 450, max: 5000}
      osl: {mean: 120, median: 90, min: 30, max: 350}
    turns: 1
  phases:
    - name: profiling
      type: gamma
      duration: 180
      rate: 1.0
      smoothness: 0.16
      concurrency: 2
      gracePeriod: 5
