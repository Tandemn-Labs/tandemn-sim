# Benchmark job: job-benchmark_timing_3hr-49-1
# Benchmark window: T+49 through T+84. Bursty traffic with a 3.5x peak/mean ratio.
# Priority: STANDARD. SLO: p99 TTFT 650 ms; p99 TPOT 50 ms.
# Smoke traffic: 1 mean RPS with the production Gamma burst shape.
schemaVersion: "2.0"
randomSeed: 101

benchmark:
  model: mistralai/Mixtral-8x7B-Instruct-v0.1
  endpoint:
    url: http://127.0.0.1:8765/v1/chat/completions
    type: chat
    streaming: true
    timeout: 180
    connectionReuse: sticky-user-sessions
  tokenizer:
    name: builtin
  dataset:
    type: synthetic
    entries: 3000
    sampling: random
    prompts:
      isl: {mean: 638, median: 478, min: 1, max: 1988}
      osl: {mean: 280, median: 210, min: 70, max: 650}
    prefixPrompts: {poolSize: 32, length: 212}
    turns: {peaks: [{value: 1, weight: 30}, {value: 4, weight: 70}]}
  phases:
    - name: profiling
      type: gamma
      duration: 35
      rate: 1.0
      smoothness: 0.16
      concurrency: 2
      gracePeriod: 5
