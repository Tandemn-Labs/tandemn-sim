# Benchmark job: job-benchmark_timing_3hr-49-2
# Benchmark window: T+49 through T+84. Bursty traffic with a 3.5x peak/mean ratio.
# Priority: HIGH. SLO: p99 TTFT 90 ms; p99 TPOT 30 ms.
# Smoke traffic: 1 mean RPS with the production Gamma burst shape.
schemaVersion: "2.0"
randomSeed: 102

benchmark:
  model: meta-llama/Llama-3.2-1B-Instruct
  endpoint:
    url: http://127.0.0.1:8765/v1/chat/completions
    type: chat
    streaming: true
    timeout: 30
    connectionReuse: pooled
  tokenizer:
    name: builtin
  dataset:
    type: synthetic
    entries: 100
    sampling: random
    prompts:
      isl: {mean: 320, median: 240, min: 80, max: 1024}
      osl: {mean: 8, median: 6, min: 2, max: 32}
    turns: 1
  phases:
    - name: profiling
      type: gamma
      duration: 35
      rate: 1.0
      smoothness: 0.16
      concurrency: 2
      gracePeriod: 5
