# Benchmark job: job-benchmark_timing_3hr-145-1
# Benchmark window: T+145 through T+180. Diurnal traffic with a 2x peak/mean ratio.
# Priority: HIGH. SLO: p99 TTFT 1000 ms; p99 TPOT 45 ms.
# Smoke traffic: ramp to 1 RPS over 35 seconds; average 0.5 RPS.
schemaVersion: "2.0"
randomSeed: 101

benchmark:
  model: meta-llama/Llama-3.3-70B-Instruct
  endpoint:
    url: http://127.0.0.1:8765/v1/chat/completions
    type: chat
    streaming: true
    timeout: 300
    connectionReuse: pooled
  tokenizer:
    name: builtin
  dataset:
    type: synthetic
    entries: 256
    sampling: random
    prompts:
      isl: {mean: 3000, median: 2250, min: 750, max: 12000}
      osl: {mean: 700, median: 525, min: 175, max: 2200}
    turns: 1
  phases:
    - name: profiling
      type: poisson
      duration: 35
      rate: 1.0
      concurrency: 2
      rateRamp: 35
      gracePeriod: 5
