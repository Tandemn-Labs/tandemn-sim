# Benchmark job: job-benchmark_timing_3hr-0-1
# Benchmark window: T+0 through T+180. Diurnal traffic with a 2x peak/mean ratio.
# Priority: LOW. SLO: p99 TTFT 700 ms; p99 TPOT 55 ms.
# Smoke traffic: ramp to 1 RPS over three minutes; average 0.5 RPS.
schemaVersion: "2.0"
randomSeed: 101

benchmark:
  model: meta-llama/Llama-3.2-1B-Instruct
  endpoint:
    url: http://127.0.0.1:8765/v1/chat/completions
    type: chat
    streaming: true
    timeout: 30
    connectionReuse: sticky-user-sessions
  tokenizer:
    name: builtin
  dataset:
    type: synthetic
    entries: 100
    sampling: random
    prompts:
      isl: {mean: 675, median: 506, min: 1, max: 1975}
      osl: {mean: 300, median: 225, min: 75, max: 700}
    prefixPrompts: {poolSize: 32, length: 225}
    turns: {peaks: [{value: 1, weight: 30}, {value: 4, weight: 70}]}
  phases:
    - name: profiling
      type: poisson
      duration: 180
      rate: 1.0
      concurrency: 2
      rateRamp: 180
      gracePeriod: 5
