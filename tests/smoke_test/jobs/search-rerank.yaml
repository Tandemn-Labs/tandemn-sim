# Benchmark job: job-benchmark_timing_3hr-7-2
# Benchmark window: T+7 through T+180. Bursty traffic with a 3.5x peak/mean ratio.
# Priority: STANDARD. SLO: p99 TTFT 160 ms; p99 TPOT 1 ms.
# Smoke traffic: 1 mean RPS with the production Gamma burst shape.
schemaVersion: "2.0"
randomSeed: 102

benchmark:
  model: BAAI/bge-reranker-v2-m3
  endpoint:
    url: http://127.0.0.1:8765/rerank
    type: hf_tei_rankings
    streaming: false
    timeout: 30
    connectionReuse: pooled
  tokenizer:
    name: builtin
  dataset:
    type: synthetic
    entries: 100
    sampling: random
    rankings:
      passages: 8
      passageTokens: {mean: 60, median: 45, min: 12, max: 252}
      queryTokens: 32
  phases:
    - name: profiling
      type: gamma
      duration: 173
      rate: 1.0
      smoothness: 0.16
      concurrency: 2
      gracePeriod: 5
