# Benchmark job: job-benchmark_timing_3hr-7-1
# Benchmark window: T+7 through T+180. Poisson traffic with a 2x peak/mean ratio.
# Priority: STANDARD. SLO: p99 TTFT 1500 ms; p99 TPOT 55 ms.
# Smoke traffic: 1 mean RPS with native Poisson arrivals.
schemaVersion: "2.0"
randomSeed: 101

benchmark:
  model: microsoft/phi-4
  endpoint:
    url: http://127.0.0.1:8765/v1/chat/completions
    type: chat
    streaming: true
    timeout: 300
    connectionReuse: sticky-user-sessions
  tokenizer:
    name: builtin
  dataset:
    type: synthetic
    entries: 512
    sampling: random
    prompts:
      isl: {mean: 6750, median: 5062, min: 1, max: 29750}
      osl: {mean: 220, median: 165, min: 55, max: 700}
    prefixPrompts: {poolSize: 32, length: 2250}
    turns: {peaks: [{value: 1, weight: 70}, {value: 3, weight: 30}]}
  phases:
    - name: profiling
      type: poisson
      duration: 173
      rate: 1.0
      concurrency: 2
      gracePeriod: 5
