# Benchmark job: job-benchmark_timing_3hr-0-5
# Benchmark window: T+0 through T+180. Constant traffic with a 1x peak/mean ratio.
# Priority: STANDARD. SLO: p99 TTFT 120 ms; p99 TPOT 1 ms.
# Smoke traffic: constant 1 RPS with at most two in-flight requests.
schemaVersion: "2.0"
randomSeed: 105

benchmark:
  model: BAAI/bge-m3
  endpoint:
    url: http://127.0.0.1:8765/v1/embeddings
    type: embeddings
    streaming: false
    timeout: 30
    connectionReuse: pooled
  tokenizer:
    name: builtin
  dataset:
    type: synthetic
    entries: 100
    sampling: random
    prompts:
      isl: {mean: 384, median: 288, min: 96, max: 1024}
      osl: 0
      batchSize: 1
  phases:
    - name: profiling
      type: constant
      duration: 180
      rate: 1.0
      concurrency: 2
      gracePeriod: 5
