# Edit this file to test a different finite batch job shape.
schema_version: "batch-dataset/v1"

dataset:
  id: batch_prompt_smoke
  model: mock-model
  endpoint: /v1/chat/completions
  request_format: chat
  record_count: 10
  seed: 42

  partitioning:
    shard_count: 1
    requests_per_shard: 10

  io:
    input_tokens:
      distribution: lognormal
      minimum: 125
      average: 500
      maximum: 2000
      sigma: 0.8
    output_tokens:
      distribution: lognormal
      minimum: 25
      average: 100
      maximum: 400
      sigma: 0.8
