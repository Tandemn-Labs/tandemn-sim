schemaVersion: "2.0"
random_seed: 101

benchmark:
  model: ${MODEL_NAME:simulated-chat-model}
  endpoint:
    url: http://preview.invalid/v1/chat/completions
    type: chat
    streaming: true
    connectionReuse: sticky-user-sessions
  tokenizer:
    name: ${TOKENIZER_NAME:builtin}
  dataset:
    type: synthetic
    entries: 1000
    prompts:
      isl: {mean: 128, stddev: 32, min: 32, max: 256}
      osl: {mean: 64, stddev: 16, min: 16, max: 128}
    # Every session shares the system prefix but receives unique user context.
    prefixPrompts:
      sharedSystemLength: 512
      userContextLength: 256
    turns: {mean: 6, stddev: 2, min: 2, max: 12}
    turnDelay: {mean: 10000, stddev: 3000, min: 1000, max: 30000}
  phases:
    # Three hours of bursty online-chat traffic.
    - name: profiling
      type: gamma
      duration: 10800       # 3 hours
      rate: 6.0             # 6 requests/second on average
      smoothness: 0.7       # clustered requests with quiet gaps
      rateRamp: 300         # ramp from low traffic during the first 5 minutes
      concurrency: 60       # never exceed 60 simultaneous requests
      gracePeriod: 120
